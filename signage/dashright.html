<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Right v1.2.0</title>
    <!-- Dashboard Right Display v1.2.0 -->
    <!-- v1.2.0: THIS FILE NO LONGER CONTAINS THE COLUMN. Its CSS and script
         moved to the shared signage/right-column.css + signage/right-column.js,
         which dashboard.html now loads too — so the right column exists once
         and cannot drift again. What is left here is a mount point and a few
         lines of Firebase wiring.

         Shipped with the same change: the column now reads TICKER on top,
         house cards in the middle, clock at the bottom (it was clock on top,
         cards below). And the Google Fonts <link> that this page always
         needed and never had — the font stack named 'Urbanist' and
         'Questrial' while only dashboard.html loaded them, so on any player
         without Century Gothic installed the two pages rendered in DIFFERENT
         TYPEFACES. That is most of why this page never quite matched.

         Four more drifts were resolved in the merge; right-column.css lists
         all five with the reasoning. The one that changes what you see here:
         nothing. The one that changes what you see on dashboard.html: its
         house names were 7cqw against this page's 9cqw, and 9cqw (the size
         the owner eyeballed on hardware) won. -->
    <!-- v1.1.0: House name bumped from 7cqw to 9cqw (~30% larger) per Jake's
         eyeball test on live hardware. Score (16cqw) unchanged. -->
    <!-- v1.0.2: Crest size fix. v1.0.1's removal of max-height let the crest
         grow too large in narrow frames (height: 90% of card = ~90% of 20vh is
         huge when the iframe is 25% of a 4K TV). Added max-width: 30cqw to cap
         the crest at 30% of the scoreboard's width, restoring the v1.0.0
         proportions that Jake approved. -->
    <!-- v1.0.1: Text sizing fix for Yodeck narrow-frame deployment. v1.0.0 used
         vw/vh viewport units, which resolve against the iframe's viewport — i.e.
         the 25%-of-TV frame width. So a 4vw score was 1/4 the size intended.
         Switched .houses-area to container-type: inline-size + cqw units so
         sizing is proportional to the scoreboard's own rendered width regardless
         of viewport dimensions. inline-size (not size) avoids the flex-child
         collapse bug that sunk v1.4.1's cq attempt elsewhere. -->
    <!-- v1.0.0: Full-screen clock-plus-scoreboard page. Lifts the right-column
         contents of dashboard.html into a standalone page that fills the viewport.

         Pulls from the same Firestore dashboard-config doc as dashboard.html and
         dashclock.html — one admin edit updates all three pages everywhere.

         Intended Yodeck layout: paired with a Canva frame (left ~75%) or similar,
         filling the right ~25% of a TV. Also works full-screen on a narrower
         secondary monitor dedicated to schedule + scores. -->
    <meta name="theme-color" content="#4B9CD3">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="../firebase-config.js"></script>
    <!-- Shared bell engine + signage schedule utils (v5.76.0): relative-bell
         resolution and emergency-shift support, shared across all three
         signage pages AND the rest of the app. Load order matters. -->
    <script src="../bell-engine.js"></script>
    <script src="schedule-utils.js"></script>
    <!-- Shared right column (v1.0.0): markup, clock tick, scoreboard, ticker. -->
    <script src="right-column.js"></script>

    <!-- v1.2.0: the webfonts this page's font stack has always named. Must
         match dashboard.html's link exactly or the two pages diverge again. -->
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&family=Questrial&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="right-column.css">
    <style>
        /* Everything about the column itself lives in right-column.css. This
           page only has to say "fill the frame". */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100vw; height: 100vh; overflow: hidden; background: var(--slate-bg); }
    </style>
</head>
<body>
    <div class="rc-mount" id="rc-mount"></div>
    <div class="version-stamp">v1.2.0</div>

    <script>
        // Dashboard Right Display v1.2.0

        if (!window.firebaseConfig) {
            throw new Error("firebase-config.js failed to load. Check <script> tag order in <head>.");
        }
        firebase.initializeApp(window.firebaseConfig);

        (async function () {
            try {
                await firebase.auth().signInAnonymously();
            } catch (err) {
                console.error('[dashright] anonymous sign-in failed:', err);
            }
            // No scheduleConfigOverride: this page has no URL-parameter mode,
            // so everything comes from the shared dashboard config doc.
            SignageRightColumn.init({
                db: firebase.firestore(),
                appId: window.firebaseConfig.appId,
                mount: document.getElementById('rc-mount')
            });
        })();
    </script>
</body>
</html>
